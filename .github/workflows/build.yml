---
name: Test & Build

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  coverage:
    uses: ./.github/workflows/coverage.yml
    secrets: inherit

  build:
    name: Build native applications
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build native workspace applications
        run: >-
          cargo build --release --locked --target x86_64-unknown-linux-musl
          -p crono-server -p crono-worker -p crono-cli

  frontend-build:
    name: Build web client
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: Build web client
        working-directory: apps/web
        run: trunk build --release

  # Builds both images from source like `docker build` from a checkout (the default
  # `runtime` stage), loads them into the runner's Docker and scans them; nothing is
  # pushed. Pull requests read the layer cache but never write it.
  images:
    name: Image (${{ matrix.image }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: crono-server
            dockerfile: services/server/Dockerfile
          - image: crono-web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The commit time, not the clock, so rebuilding a commit yields the same image
      # timestamps and labels, and the publish job below hits this cache.
      - name: Read the commit time
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct)"
          {
            echo "epoch=${epoch}"
            echo "created=$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ matrix.image }}:ci
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.commit.outputs.epoch }}
            VERSION=dev-${{ github.sha }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.commit.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,scope={0},mode=max', matrix.image) || '' }}

      # Fixed HIGH and CRITICAL vulnerabilities fail the build. To accept one, add its
      # ID with the reason to a root .trivyignore, which Trivy reads by default.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # One aggregate check for branch protection and the release flow: it passes only
  # when every gating job succeeded, so the required check never depends on job or
  # matrix names. Coverage is reported, not a gate.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - test
      - build
      - frontend-build
      - images
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::A required job finished with '${result}'."
              exit 1
            fi
          done

  # Development images for staging deploys: every push to develop or main pushes
  # ghcr.io/<owner>/<image>:dev-<commit> (never `sha-`, which names release
  # candidates, and a release commit is also main's head) with SBOM, provenance and
  # an attestation, rebuilt from the cache the images job just wrote. Deploy the
  # digest from the job summary, never the tag. Pull requests never reach this job.
  images-publish:
    name: Publish image (${{ matrix.image }})
    needs: ci-ok
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: crono-server
            dockerfile: services/server/Dockerfile
            description: Crono control-plane API, scheduler, and outbox publisher
          - image: crono-web
            dockerfile: apps/web/Dockerfile
            description: Crono web client served by unprivileged nginx
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the commit time
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct)"
          {
            echo "epoch=${epoch}"
            echo "created=$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=dev-${{ github.sha }}
            org.opencontainers.image.created=${{ steps.commit.outputs.created }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=dev-${{ github.sha }}
            org.opencontainers.image.created=${{ steps.commit.outputs.created }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.commit.outputs.epoch }}
            VERSION=dev-${{ github.sha }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.commit.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Report the digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: dev-${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::${IMAGE} has no valid digest (got '${DIGEST}')."
            exit 1
          fi
          {
            echo "### ${IMAGE}"
            echo
            echo "| Tag | Digest |"
            echo "| --- | --- |"
            echo "| \`${TAG}\` | \`${DIGEST}\` |"
            echo
            echo "Deploy as \`${IMAGE}@${DIGEST}\`."
          } >> "$GITHUB_STEP_SUMMARY"
