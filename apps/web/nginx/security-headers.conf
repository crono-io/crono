# Security headers for every crono-web response.
#
# nginx drops inherited `add_header` directives in any block that declares its
# own, so each location in default.conf includes this file next to its
# Cache-Control header instead of relying on server-level inheritance.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
