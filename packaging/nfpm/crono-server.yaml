# nfpm definition for the crono-server .deb and .rpm, built by
# scripts/package.sh from the static musl release binary. VERSION and ARCH
# (amd64 or arm64) come from that script, which also stages the binaries in
# target/package-bin.
name: crono-server
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Crono maintainers <nbari@tequila.io>
vendor: Crono
homepage: https://github.com/crono-io/crono
license: BSD-3-Clause
description: |-
  Crono control-plane server
  HTTP API, scheduler, outbox publisher, and reconciler for Crono's
  PostgreSQL-backed scheduling of infrastructure automation, dispatched to
  workers through NATS JetStream.

contents:
  - src: target/package-bin/crono-server
    dst: /usr/bin/crono-server
    file_info:
      mode: 0755
  - src: target/package-bin/crono-server-openapi
    dst: /usr/bin/crono-server-openapi
    file_info:
      mode: 0755
  - src: packaging/systemd/crono-server.service
    dst: /usr/lib/systemd/system/crono-server.service
    file_info:
      mode: 0644
  - dst: /etc/crono
    type: dir
    file_info:
      mode: 0755
  - src: packaging/config/server.env
    dst: /etc/crono/server.env
    type: config|noreplace
    file_info:
      mode: 0640

scripts:
  preinstall: packaging/scripts/preinstall.sh
  postinstall: packaging/scripts/server-postinstall.sh
  preremove: packaging/scripts/server-preremove.sh
  postremove: packaging/scripts/postremove.sh
