---
name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve and validate version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ ! "${tag}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "Unsupported release tag '${tag}'; expected X.Y.Z." >&2
              exit 1
            fi

            version="${BASH_REMATCH[1]}"
            manifest_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
            if [[ "${version}" != "${manifest_version}" ]]; then
              echo "Tag ${tag} does not match workspace version ${manifest_version}." >&2
              exit 1
            fi

            echo "is_release=true" >> "${GITHUB_OUTPUT}"
          else
            version="snapshot-${GITHUB_SHA:0:7}"
            echo "is_release=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.target }})
    needs:
      - test
      - metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build native workspace applications
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p crono-server -p crono-worker -p crono-cli

      - name: Build archives
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          release_dir="${GITHUB_WORKSPACE}/release-artifacts"
          mkdir -p "${release_dir}"

          for binary_name in crono-server crono-server-openapi crono-worker crono; do
            executable="target/${TARGET}/release/${binary_name}"
            archive_name="${binary_name}-${RELEASE_VERSION}-${TARGET}"
            staging_dir="${release_dir}/${archive_name}"
            mkdir "${staging_dir}"
            cp "${executable}" "${staging_dir}/"
            tar -C "${release_dir}" -czf "${release_dir}/${archive_name}.tar.gz" "${archive_name}"
          done

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-native-${{ matrix.target }}
          path: release-artifacts/*.tar.gz
          if-no-files-found: error

  frontend-build:
    name: Build web client
    needs:
      - test
      - metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: Build web client
        working-directory: apps/web
        run: trunk build --release

      - name: Package web client
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          tar -C apps/web -czf "${GITHUB_WORKSPACE}/release-artifacts/crono-web-${RELEASE_VERSION}.tar.gz" dist

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: release-artifacts/crono-web-${{ needs.metadata.outputs.version }}.tar.gz
          if-no-files-found: error

  # Container images for Kubernetes: crono-server and crono-web, each a
  # multi-platform linux/amd64 + linux/arm64 index built from the binaries and
  # bundle above rather than recompiled. Every run builds them; only X.Y.Z tags
  # push to GHCR with SBOM, provenance, and a GitHub artifact attestation.
  images:
    name: Image (${{ matrix.image }})
    needs:
      - metadata
      - build
      - frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: crono-server
            dockerfile: services/server/Dockerfile
            description: Crono control-plane API, scheduler, and outbox publisher
          - image: crono-web
            dockerfile: apps/web/Dockerfile
            description: Crono web client served by unprivileged nginx
    env:
      PUSH: ${{ needs.metadata.outputs.is_release }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      # Stage <platform>/crono-server and web/{dist,nginx}; see the Dockerfiles.
      - name: Stage image build context
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          context=image-context
          for pair in amd64:x86_64 arm64:aarch64; do
            platform="linux/${pair%%:*}"
            target="${pair#*:}-unknown-linux-musl"
            mkdir -p "${context}/${platform}"
            tar -xzf "artifacts/crono-server-${RELEASE_VERSION}-${target}.tar.gz" \
              --strip-components=1 -C "${context}/${platform}"
          done
          mkdir -p "${context}/web"
          tar -xzf "artifacts/crono-web-${RELEASE_VERSION}.tar.gz" -C "${context}/web"
          cp -R apps/web/nginx "${context}/web/nginx"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.metadata.outputs.version }},enable=${{ env.PUSH == 'true' }}
            type=raw,value=latest,enable=${{ env.PUSH == 'true' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: image-context
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}

      - name: Attest image provenance
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # .deb and .rpm packages for VM installs of crono-server, crono-worker, and
  # the CLI, for amd64 and arm64, built from the same static musl binaries.
  packages:
    name: Linux packages
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-native-*-unknown-linux-musl
          path: artifacts
          merge-multiple: true

      - name: Build .deb and .rpm packages
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"
            target="${pair#*:}-unknown-linux-musl"
            bin_dir="target/release-bin/${arch}"
            mkdir -p "${bin_dir}"
            for binary in crono-server crono-server-openapi crono-worker crono; do
              tar -xzf "artifacts/${binary}-${RELEASE_VERSION}-${target}.tar.gz" \
                --strip-components=1 -C "${bin_dir}"
            done
            bash scripts/package.sh "${RELEASE_VERSION}" "${arch}" "${bin_dir}" release-artifacts
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |-
            release-artifacts/*.deb
            release-artifacts/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: needs.metadata.outputs.is_release == 'true'
    needs:
      - metadata
      - build
      - frontend-build
      - images
      - packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: artifacts/*

  docs:
    name: Publish API reference
    if: needs.metadata.outputs.is_release == 'true'
    needs:
      - metadata
      - release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
