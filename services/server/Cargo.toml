[package]
name = "crono-server"
description = "API-driven control plane for Crono"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "../../build.rs"

[[bin]]
name = "crono-server-openapi"
path = "src/bin/openapi.rs"

[lints]
workspace = true

[features]
default = []
telemetry = ["crono-telemetry/telemetry"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
crono-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tower-http.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
opentelemetry-proto.workspace = true
temp-env.workspace = true
tokio = { workspace = true, features = ["net", "process", "sync", "time"] }
tokio-stream.workspace = true
tonic.workspace = true
tower.workspace = true

[build-dependencies]
built.workspace = true
