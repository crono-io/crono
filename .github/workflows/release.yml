---
name: Release

# Run manually on `develop` (`just release`). The commit is the one Test & Build already
# passed on develop; this workflow bumps and commits nothing. It builds that commit once
# (the native binaries for four targets, the web client, the Linux packages and the two
# multi-platform images pushed under `sha-<commit>`), publishes the GitHub release (which
# creates the tag), then tags the tested image digests, notifies crono-helm and publishes
# the API reference. `main` is moved by `just release` once this run has succeeded and
# develop's own Test & Build has finished (a still-pending `CI OK` blocks protected-branch
# updates). A failed job is fixed with "Re-run failed jobs"; nothing is published before
# every build job has succeeded.
on:
  workflow_dispatch:

# One release at a time; a second dispatch waits instead of replacing or cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

# Read-only by default; jobs that publish ask for more.
permissions:
  contents: read

jobs:
  # Everything that can be known before building: the branch, the version, that no
  # release of it exists, that the commit passed Test & Build, and that the committed API
  # contract already carries the version (the bump touches Cargo.toml, Cargo.lock and the
  # OpenAPI contract's info.version).
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit can be released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/heads/develop ]]; then
            echo "::error::Run the release on develop (got ${GITHUB_REF})."
            exit 1
          fi
          version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml has no X.Y.Z workspace version (found '${version}')."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "::error::${version} is already tagged; bump the version on develop first."
            exit 1
          fi
          latest="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [[ -n "${latest}" && "$(printf '%s\n%s\n' "${latest}" "${version}" | sort -V | tail -n 1)" != "${version}" ]]; then
            echo "::error::${version} is below the latest release ${latest}; bump to a higher version."
            exit 1
          fi
          found="$(jq -r .info.version docs/openapi/crono-server.json)"
          if [[ "${found}" != "${version}" ]]; then
            echo "::error::docs/openapi/crono-server.json is for ${found}, not ${version}; run just openapi and commit it with the bump."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main "${GITHUB_SHA}"; then
            echo "::error::main has commits that develop does not; merge main into develop first."
            exit 1
          fi
          # `CI OK` is Test & Build's aggregate of every gating job; it must have
          # succeeded on exactly this commit (a non-gating job, such as coverage, failing
          # does not block the release).
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=CI%20OK&status=completed" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [[ "${passed}" -lt 1 ]]; then
            echo "::error::${GITHUB_SHA} has no successful CI OK check; wait for Test & Build to pass on develop."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} from ${GITHUB_SHA} (CI OK passed)."

  build:
    name: Build (${{ matrix.target }})
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Exported for reproducible-build-aware tools only: `built` runs without its
      # `chrono` feature, so the binaries embed the commit hash but no build time.
      - name: Export the commit time as SOURCE_DATE_EPOCH
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build native workspace applications
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p crono-server -p crono-worker -p crono-cli

      - name: Build archives
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          release_dir="${GITHUB_WORKSPACE}/release-artifacts"
          mkdir -p "${release_dir}"

          for binary_name in crono-server crono-server-openapi crono-worker crono; do
            executable="target/${TARGET}/release/${binary_name}"
            archive_name="${binary_name}-${RELEASE_VERSION}-${TARGET}"
            staging_dir="${release_dir}/${archive_name}"
            mkdir "${staging_dir}"
            cp "${executable}" "${staging_dir}/"
            tar -C "${release_dir}" -czf "${release_dir}/${archive_name}.tar.gz" "${archive_name}"
          done

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-native-${{ matrix.target }}
          path: release-artifacts/*.tar.gz
          if-no-files-found: error

  frontend-build:
    name: Build web client
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked

      # Trunk downloads wasm-bindgen and wasm-opt (and Tailwind when asked) from GitHub
      # releases; a cache means a build after the first one does not depend on those
      # downloads, on a hosted or a self-hosted runner alike.
      - name: Cache Trunk's downloaded tools
        uses: ./.github/actions/trunk-cache

      - name: Build web client
        working-directory: apps/web
        run: trunk build --release

      - name: Package web client
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          tar -C apps/web -czf "${GITHUB_WORKSPACE}/release-artifacts/crono-web-${RELEASE_VERSION}.tar.gz" dist

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-web
          path: release-artifacts/crono-web-${{ needs.guard.outputs.version }}.tar.gz
          if-no-files-found: error

  # Container images for Kubernetes: crono-server and crono-web, each a
  # multi-platform linux/amd64 + linux/arm64 index built from the binaries and
  # bundle above rather than recompiled. Each is pushed only as `sha-<commit>`, with
  # SBOM, provenance and a GitHub artifact attestation, and its digest is recorded; the
  # release tags exactly that digest.
  images:
    name: Image (${{ matrix.image }})
    needs:
      - guard
      - build
      - frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: crono-server
            dockerfile: services/server/Dockerfile
            description: Crono control-plane API, scheduler, and outbox publisher
          - image: crono-web
            dockerfile: apps/web/Dockerfile
            description: Crono web client served by unprivileged nginx
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the Linux binaries
        uses: actions/download-artifact@v8
        with:
          pattern: dist-native-*-unknown-linux-musl
          path: artifacts
          merge-multiple: true

      - name: Download the web client
        uses: actions/download-artifact@v8
        with:
          name: dist-web
          path: artifacts

      # Stage <platform>/crono-server and web/{dist,nginx}; see the Dockerfiles.
      - name: Stage image build context
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          context=image-context
          for pair in amd64:x86_64 arm64:aarch64; do
            platform="linux/${pair%%:*}"
            target="${pair#*:}-unknown-linux-musl"
            mkdir -p "${context}/${platform}"
            tar -xzf "artifacts/crono-server-${RELEASE_VERSION}-${target}.tar.gz" \
              --strip-components=1 -C "${context}/${platform}"
          done
          mkdir -p "${context}/web"
          tar -xzf "artifacts/crono-web-${RELEASE_VERSION}.tar.gz" -C "${context}/web"
          cp -R apps/web/nginx "${context}/web/nginx"

      # BuildKit takes the SOURCE_DATE_EPOCH build arg below as the image creation
      # time, so rebuilding the commit yields the same image timestamps.
      - name: Export the commit time as SOURCE_DATE_EPOCH
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The only tag pushed here is sha-<commit>; the release adds the version, X.Y and
      # latest tags to its digest.
      - name: Resolve image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          # GHCR reads a multi-platform package's description from the index,
          # so annotate it as well as each platform manifest.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}

      # `target: prebuilt` copies the staged binaries and bundle; without it the
      # default `runtime` stage would recompile from sources not in this context.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: image-context
          file: ${{ matrix.dockerfile }}
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,scope=release-${{ matrix.image }},mode=max
          provenance: mode=max
          sbom: true

      # A vulnerable image stops here: its digest is never recorded, so the release job
      # fails and nothing is published. Each platform of the index is scanned; accepted
      # findings go in the root .trivyignore with their reason.
      - name: Scan image (linux/amd64)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan image (linux/arm64)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The tagging job collects one digest per image from these small artifacts.
      - name: Record the digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::${NAME} has no valid digest (got '${DIGEST}')."
            exit 1
          fi
          mkdir -p image-digest
          echo "${NAME} ${DIGEST}" > "image-digest/${NAME}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.image }}
          path: image-digest/${{ matrix.image }}
          if-no-files-found: error

  # .deb and .rpm packages for VM installs of crono-server, crono-worker, and
  # the CLI, for amd64 and arm64, built from the same static musl binaries.
  packages:
    name: Linux packages
    needs:
      - guard
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          pattern: dist-native-*-unknown-linux-musl
          path: artifacts
          merge-multiple: true

      - name: Build .deb and .rpm packages
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"
            target="${pair#*:}-unknown-linux-musl"
            bin_dir="target/release-bin/${arch}"
            mkdir -p "${bin_dir}"
            for binary in crono-server crono-server-openapi crono-worker crono; do
              tar -xzf "artifacts/${binary}-${RELEASE_VERSION}-${target}.tar.gz" \
                --strip-components=1 -C "${bin_dir}"
            done
            bash scripts/package.sh "${RELEASE_VERSION}" "${arch}" "${bin_dir}" release-artifacts
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: |-
            release-artifacts/*.deb
            release-artifacts/*.rpm
          if-no-files-found: error

  # The GitHub release gets exactly the built files and no others. Publishing creates the
  # tag at the tested commit.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - guard
      - build
      - frontend-build
      - packages
      - images
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history and tags: the release notes list the commits since the previous release.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # A release cannot be completed later, so the file set is checked first. Keep this
      # in step with the build jobs: a missing or extra file stops the release.
      - name: Check the release files
        shell: bash
        run: |
          set -euo pipefail
          expected="$(
            {
              for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
                for binary in crono-server crono-server-openapi crono-worker crono; do
                  echo "${binary}-${VERSION}-${target}.tar.gz"
                done
              done
              echo "crono-web-${VERSION}.tar.gz"
            } | sort
          )"
          actual="$(ls dist | grep -vE '\.(deb|rpm)$' | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::The built files differ from the expected set."
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
          # 2 architectures x 3 programs x deb and rpm.
          packages="$(ls dist | grep -cE '\.(deb|rpm)$' || true)"
          if [[ "${packages}" -ne 12 ]]; then
            echo "::error::Expected 12 .deb and .rpm packages, found ${packages}."
            exit 1
          fi

      - name: Write the checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # A signed statement that this run built exactly these files (the images carry
      # their own attestations): `gh attestation verify <file> --repo crono-io/crono
      # --signer-workflow crono-io/crono/.github/workflows/release.yml` works on downloads.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      # The notes are the commit subjects since the previous release (version bumps left
      # out), so no changelog is kept by hand and every re-run writes the same text.
      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "${GITHUB_SHA}" 2>/dev/null || true)"
          range="${GITHUB_SHA}"
          [[ -z "${previous}" ]] || range="${previous}..${GITHUB_SHA}"
          changes="$(git log --no-merges --format='- %s (%h)' "${range}" | grep -vE '^- bump version to [0-9]+\.[0-9]+\.[0-9]+ ' || true)"
          {
            echo "## Changes"
            echo
            echo "${changes:-- Only the version bump.}"
            if [[ -n "${previous}" ]]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${VERSION}"
            fi
            echo
            echo "## Verify a download"
            echo
            echo '```sh'
            echo 'sha256sum --check --ignore-missing SHA256SUMS'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            echo '```'
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      # Assets go on a draft first, so a failed upload never leaves a public half release.
      # A draft left by a failed run is replaced; a published release is left alone. The
      # guard made this the highest version, so it is GitHub's Latest release.
      - name: Create the release
        shell: bash
        run: |
          set -euo pipefail
          if state="$(gh release view "${VERSION}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "${state}" == false ]]; then
              echo "Release ${VERSION} is already published."
              exit 0
            fi
            gh release delete "${VERSION}" --yes
          fi
          gh release create "${VERSION}" dist/* \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
          gh release edit "${VERSION}" --draft=false --latest

      # What a user can download must be exactly what was built, and the tag must sit on
      # the tested commit. This also runs when a re-run finds the release already published.
      - name: Check the published release
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq '.object.sha')"
          if [[ "${tag_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${VERSION} points at ${tag_sha}, not at the tested commit ${GITHUB_SHA}."
            exit 1
          fi
          expected="$(ls dist | sort)"
          actual="$(gh release view "${VERSION}" --json assets --jq '.assets[].name' | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Release ${VERSION} holds: $(tr '\n' ' ' <<<"${actual}"); expected: $(tr '\n' ' ' <<<"${expected}")."
            exit 1
          fi
          echo "Release ${VERSION} is on ${GITHUB_SHA} with $(wc -l <<<"${actual}") files."

  # Add the version tag, and `X.Y` and `latest` while the version is the highest release
  # of its line and overall, to the tested image digests. skopeo copies within the same
  # repository with the digest preserved, so the tested index, its SBOM, provenance and
  # attestation are what the tags name; re-running is a no-op. The promoted digests and
  # the latest-release answer are outputs for the crono-helm job.
  images-publish:
    name: Tag images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - guard
      - images
      - release
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
      server_digest: ${{ steps.tag.outputs.crono-server }}
      web_digest: ${{ steps.tag.outputs.crono-web }}
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Is this the latest release
        id: latest
        uses: ./.github/actions/release-is-latest
        with:
          tag: ${{ needs.guard.outputs.version }}
          token: ${{ github.token }}

      - name: Download the image digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Tag the tested digests
        id: tag
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.guard.outputs.version }}
          LATEST: ${{ steps.latest.outputs.latest }}
          LATEST_MINOR: ${{ steps.latest.outputs.latest_minor }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y skopeo; }
          echo "${TOKEN}" | skopeo login ghcr.io -u "${ACTOR}" --password-stdin
          tags=("${VERSION}")
          [[ "${LATEST_MINOR}" != true ]] || tags+=("${VERSION%.*}")
          [[ "${LATEST}" != true ]] || tags+=(latest)
          for image in crono-server crono-web; do
            read -r name digest < "${RUNNER_TEMP}/images/${image}"
            [[ "${name}" == "${image}" && "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Bad digest for ${image}: ${name} ${digest}"; exit 1; }
            repository="ghcr.io/${OWNER}/${image}"
            source="docker://${repository}@${digest}"
            skopeo inspect --raw "${source}" >/dev/null
            for tag in "${tags[@]}"; do
              skopeo copy --all --preserve-digests "${source}" "docker://${repository}:${tag}"
              actual="sha256:$(skopeo inspect --raw "docker://${repository}:${tag}" | sha256sum | cut -d' ' -f1)"
              if [[ "${actual}" != "${digest}" ]]; then
                echo "::error::${repository}:${tag} is ${actual}, not the tested ${digest}."
                exit 1
              fi
              echo "${repository}:${tag} -> ${digest}"
            done
            echo "${image}=${digest}" >> "$GITHUB_OUTPUT"
          done

  # Once the images carry the version tag, tell crono-helm to bump its charts to this
  # release with exactly the digests promoted above. Only the highest release goes there,
  # so a re-run of an older release never moves the charts back; without the crono-helm
  # App configured the dispatch is skipped with a warning.
  helm:
    name: Notify crono-helm
    needs:
      - guard
      - images-publish
    if: needs.images-publish.outputs.latest == 'true'
    permissions: {}
    uses: ./.github/workflows/dispatch-helm-release.yml
    with:
      version: ${{ needs.guard.outputs.version }}
      source_sha: ${{ github.sha }}
      server_digest: ${{ needs.images-publish.outputs.server_digest }}
      web_digest: ${{ needs.images-publish.outputs.web_digest }}
    secrets:
      CRONO_HELM_APP_PRIVATE_KEY: ${{ secrets.CRONO_HELM_APP_PRIVATE_KEY }}

  # Publish the committed API contract to GitHub Pages, only while the version is the
  # highest release. It shares the `pages` group with the manual API Docs workflow, so
  # two deploys never overlap.
  docs:
    name: Publish API reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - guard
      - release
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Is this the latest release
        id: latest
        uses: ./.github/actions/release-is-latest
        with:
          tag: ${{ needs.guard.outputs.version }}
          token: ${{ github.token }}

      - name: Configure GitHub Pages
        if: steps.latest.outputs.latest == 'true'
        uses: actions/configure-pages@v6

      - name: Upload API reference
        if: steps.latest.outputs.latest == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/openapi

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.latest.outputs.latest == 'true'
        uses: actions/deploy-pages@v5
