name: Release is latest
description: >-
  Whether a tag is the highest X.Y.Z release tag right now, overall and within the tag's
  X.Y line. The production steps (GitHub's Latest release, the `latest` and `X.Y` image
  tags, the API reference on GitHub Pages) call it immediately before they act, so a
  re-run job of an older release never rolls them back. It fails when GitHub cannot be
  asked, instead of treating that as "no releases". Without a tag it only reports the
  highest release (the manual API Docs run publishes that one).
inputs:
  tag:
    description: >-
      The X.Y.Z tag being published; empty only asks for the highest release.
    required: false
    default: ''
  token:
    description: A token that can read the repository.
    required: true
outputs:
  latest:
    description: "'true' when the tag is the highest release, otherwise 'false'."
    value: ${{ steps.check.outputs.latest }}
  highest:
    description: The highest release (empty when there is none).
    value: ${{ steps.check.outputs.highest }}
  latest_minor:
    description: "'true' when the tag is the highest release of its X.Y line."
    value: ${{ steps.check.outputs.latest_minor }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        # A plain assignment, so a failing listing fails the step instead of looking
        # like "no releases".
        tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name')"
        sorted="$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"${tags}" | sort -rV || true)"
        highest="$(head -n 1 <<<"${sorted}")"
        highest_minor=""
        if [[ -n "${TAG}" ]]; then
          highest_minor="$(grep -F -- "${TAG%.*}." <<<"${sorted}" | head -n 1 || true)"
        fi
        latest=false
        if [[ -n "${TAG}" && "${highest}" == "${TAG}" ]]; then
          latest=true
        fi
        latest_minor=false
        if [[ -n "${TAG}" && "${highest_minor}" == "${TAG}" ]]; then
          latest_minor=true
        fi
        {
          echo "latest=${latest}"
          echo "highest=${highest}"
          echo "latest_minor=${latest_minor}"
        } >> "$GITHUB_OUTPUT"
        echo "Highest release: ${highest:-none}${TAG:+; of ${TAG%.*}.x: ${highest_minor:-none}; ${TAG} is the latest: ${latest}, of its line: ${latest_minor}}."
