---
name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve and validate version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ ! "${tag}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "Unsupported release tag '${tag}'; expected X.Y.Z." >&2
              exit 1
            fi

            version="${BASH_REMATCH[1]}"
            manifest_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
            if [[ "${version}" != "${manifest_version}" ]]; then
              echo "Tag ${tag} does not match workspace version ${manifest_version}." >&2
              exit 1
            fi

            echo "is_release=true" >> "${GITHUB_OUTPUT}"
          else
            version="snapshot-${GITHUB_SHA:0:7}"
            echo "is_release=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.target }})
    needs:
      - test
      - metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build native workspace applications
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p crono-server -p crono-worker -p crono-cli

      - name: Build archives
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          release_dir="${GITHUB_WORKSPACE}/release-artifacts"
          mkdir -p "${release_dir}"

          for binary_name in crono-server crono-server-openapi crono-worker crono; do
            executable="target/${TARGET}/release/${binary_name}"
            archive_name="${binary_name}-${RELEASE_VERSION}-${TARGET}"
            staging_dir="${release_dir}/${archive_name}"
            mkdir "${staging_dir}"
            cp "${executable}" "${staging_dir}/"
            tar -C "${release_dir}" -czf "${release_dir}/${archive_name}.tar.gz" "${archive_name}"
          done

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-native-${{ matrix.target }}
          path: release-artifacts/*.tar.gz
          if-no-files-found: error

  frontend-build:
    name: Build web client
    needs:
      - test
      - metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: Build web client
        working-directory: apps/web
        run: trunk build --release

      - name: Package web client
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          tar -C apps/web -czf "${GITHUB_WORKSPACE}/release-artifacts/crono-web-${RELEASE_VERSION}.tar.gz" dist

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: release-artifacts/crono-web-${{ needs.metadata.outputs.version }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: needs.metadata.outputs.is_release == 'true'
    needs:
      - metadata
      - build
      - frontend-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: artifacts/*

  docs:
    name: Publish API reference
    if: needs.metadata.outputs.is_release == 'true'
    needs:
      - metadata
      - release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
