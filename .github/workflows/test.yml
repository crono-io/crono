---
name: Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Clippy native workspace
        run: |
          cargo clippy --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets --all-features

      - name: Clippy web client
        run: cargo clippy --locked -p crono-web --target wasm32-unknown-unknown

  check:
    name: Feature Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Check minimal feature set
        run: cargo check --locked --workspace

      - name: Check all features
        run: cargo check --locked --workspace --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - format
      - lint
      - check
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-test-infrastructure

      - name: Test minimal feature set
        run: cargo test --locked --workspace

      - name: Test all features
        run: cargo test --locked --workspace --all-features
