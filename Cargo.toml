[workspace]

resolver = "3"

members = [
    "services/server",
    "services/worker",
    "apps/cli",
    "apps/web",
    "crates/api",
    "crates/telemetry",
]
default-members = ["services/server", "services/worker", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/crono-io/crono"
publish = false

[workspace.dependencies]
crono-api = { path = "crates/api" }
crono-telemetry = { path = "crates/telemetry", default-features = false }
anyhow = "1"
async-nats = { version = "0.50.0", default-features = false, features = ["jetstream", "nkeys", "ring", "server_2_14"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["tracing"] }
built = { version = "0.8", features = ["git2"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6", features = ["env"] }
cron = "0.17.0"
futures-util = "0.3.34"
gloo-net = "0.7"
leptos = { version = "0.8", default-features = false, features = ["csr"] }
leptos_router = "0.8"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "grpc-tonic", "gzip-tonic", "tls-ring", "tls-webpki-roots"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
prometheus-client = "0.25.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "uuid"] }
temp-env = "0.3"
tempfile = "3.27.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "gzip"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
utoipa = { version = "6", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.3"
uuid = { version = "1", features = ["js", "serde", "v7"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-test = "0.3.78"
web-sys = { version = "0.3.105", features = ["Document", "Element", "Event", "HtmlElement", "HtmlInputElement", "MouseEvent", "Node", "Window"] }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"
needless_collect = "deny"
large_stack_arrays = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
