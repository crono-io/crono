name: Trunk tool cache
description: >-
  Cache the tools Trunk downloads from GitHub releases at build time (wasm-bindgen and
  wasm-opt, plus Tailwind when Trunk fetches it), so a build after the first one does not
  depend on those downloads. Runs on GitHub-hosted and self-hosted runners alike. The key
  names the installed Trunk version (it picks the wasm-opt version), the wasm-bindgen
  version from Cargo.lock and a hash of apps/web/Trunk.toml (its `[tools]` pins). Expects
  the repository to be checked out and Trunk to be installed.
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        set -euo pipefail
        wasm_bindgen="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/, "", $0); print; exit}' Cargo.lock)"
        if [[ -z "${wasm_bindgen}" ]]; then
          echo "::error::Cargo.lock has no wasm-bindgen package."
          exit 1
        fi
        trunk="$(trunk --version | awk '{print $2}')"
        if [[ -z "${trunk}" ]]; then
          echo "::error::Trunk is not installed; install it before this action."
          exit 1
        fi
        {
          echo "wasm-bindgen=${wasm_bindgen}"
          echo "trunk=${trunk}"
        } >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      with:
        path: ~/.cache/trunk
        key: trunk-tools-${{ runner.os }}-trunk-${{ steps.versions.outputs.trunk }}-wasm-bindgen-${{ steps.versions.outputs.wasm-bindgen }}-${{ hashFiles('apps/web/Trunk.toml') }}
        restore-keys: |
          trunk-tools-${{ runner.os }}-trunk-${{ steps.versions.outputs.trunk }}-
