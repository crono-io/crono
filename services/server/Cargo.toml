[package]
name = "crono-server"
description = "API-driven control plane for Crono"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "../../build.rs"

[[bin]]
name = "crono-server-openapi"
path = "src/bin/openapi.rs"

[lints]
workspace = true

[features]
default = []
telemetry = ["crono-telemetry/telemetry"]

[dependencies]
anyhow.workspace = true
async-nats.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
cron-parser.workspace = true
crono-api = { workspace = true, features = ["openapi"] }
crono-execution.workspace = true
crono-telemetry.workspace = true
futures-util.workspace = true
prometheus-client.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
sqlx.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

[dev-dependencies]
opentelemetry-proto.workspace = true
temp-env.workspace = true
tokio = { workspace = true, features = ["net", "process", "sync", "time"] }
tokio-stream.workspace = true
tonic.workspace = true
tower.workspace = true

[build-dependencies]
built.workspace = true
