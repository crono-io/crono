[package]
name = "crono-worker"
description = "Bounded JetStream execution worker for Crono"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "../../build.rs"

[lints]
workspace = true

[features]
default = []
telemetry = ["crono-telemetry/telemetry"]

[dependencies]
anyhow.workspace = true
async-nats.workspace = true
clap.workspace = true
chrono = { workspace = true, features = ["serde"] }
crono-api.workspace = true
crono-execution.workspace = true
crono-telemetry.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "signal"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
opentelemetry-proto.workspace = true
tokio = { workspace = true, features = ["net", "process", "sync", "time"] }
tokio-stream.workspace = true
tonic.workspace = true

[build-dependencies]
built.workspace = true
