---
name: Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Clippy native workspace
        run: |
          cargo clippy --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets --all-features

      - name: Clippy web client
        run: cargo clippy --locked -p crono-web --target wasm32-unknown-unknown

  check:
    name: Feature Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain

      - name: Check minimal feature set
        run: cargo check --locked --workspace

      - name: Check all features
        run: cargo check --locked --workspace --all-features

  browser:
    name: Browser UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - name: Install browser test runner
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Test web components in headless Chrome
        run: cargo test --locked -p crono-web --target wasm32-unknown-unknown

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - format
      - lint
      - check
      - browser
    env:
      # The PostgreSQL setup-test-infrastructure starts; without it the database tests fail.
      CRONO_TEST_DATABASE_URL: postgres://crono_runtime@127.0.0.1:5432/crono
      CRONO_TEST_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/setup-test-infrastructure

      - name: Test minimal feature set
        run: cargo test --locked --workspace

      - name: Test all features
        run: cargo test --locked --workspace --all-features
