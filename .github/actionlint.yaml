# actionlint 1.7.12 does not know the concurrency `queue` key yet, which GitHub Actions
# supports (`queue: max` keeps every pending job instead of replacing it). The release
# and API Docs workflows use it on their production jobs; ignore only that message, only
# there.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/docs.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
