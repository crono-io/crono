# actionlint 1.7.12 does not know the concurrency `queue` key yet, which GitHub Actions
# supports (`queue: max` keeps every pending job instead of replacing it). The API Docs
# workflow uses it on its production job; ignore only that message, only there.
paths:
  .github/workflows/docs.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
