---
name: API Docs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish API Reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # The committed contract is published as-is: the drift test in the
      # release's test job already guarantees it matches the routes.
      - name: Upload API reference
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/openapi

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
