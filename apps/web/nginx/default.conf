# Static hosting for the crono-web single-page app.
#
# This origin serves the compiled bundle only. `/api` belongs to crono-server
# and must be routed there by the Ingress or Gateway; a misrouted API request
# gets a 404 here instead of the app shell, so the mistake is visible.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects stay relative so they survive TLS termination and port mapping.
    absolute_redirect off;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Applies to responses produced at server level (405, 404, 403); locations
    # that set their own headers include the snippet again.
    include /etc/nginx/snippets/security-headers.conf;

    # A static origin only needs safe methods.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Never expose hidden files.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Kubernetes liveness and readiness probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    # The app shell revalidates on every load so new asset hashes are found.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Trunk fingerprints the script, wasm module, and stylesheet
    # (`crono-web-<hash>.js`, `crono-web-<hash>_bg.wasm`, `style-<hash>.css`).
    location ~* "^/.+-[0-9a-f]{8,}(?:_bg)?\.(?:css|js|wasm)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unfingerprinted static files get a short lifetime.
    location ~* \.(?:png|svg|ico|webmanifest|txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Client-side routes such as /runs/{id} fall back to the app shell.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
